services:
  postgres:
    image: postgres:16
    container_name: edu_postgres
    environment:
      POSTGRES_USER: edu_admin
      POSTGRES_PASSWORD: edu_password
      POSTGRES_DB: edu_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: edu_redis
    ports:
      - "6379:6379"

  auth_service:
    build: ./backend/auth
    container_name: edu_auth
    environment:
      DATABASE_URL: postgresql://edu_admin:edu_password@postgres:5432/edu_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "your_super_secret_key_here_change_in_production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  courses_service:
    build: ./backend/courses
    container_name: edu_courses
    environment:
      DATABASE_URL: postgresql://edu_admin:edu_password@postgres:5432/edu_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "your_super_secret_key_here_change_in_production"
      ALGORITHM: "HS256"
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: